name: Detection benchmark

# Guards the per-signal false-positive budget against the committed corpus.
#
# The gate fails on an observed-human capture family crossing a per-signal
# budget, an incomplete replay, or a fixed-corpus agent regression. Aggregate
# population claims remain warnings: this corpus is captured, not sampled. See
# bench/README.md.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Install server dependencies
        working-directory: server-node
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        working-directory: server-node
        run: npm test

      - name: Start server
        working-directory: server-node
        env:
          FCAPTCHA_SECRET: benchmark-test-secret-0123456789abcdef0123456789abcdef
        run: |
          node server.js &
          for _ in $(seq 1 40); do
            curl -sf http://localhost:3000/health >/dev/null && exit 0
            sleep 0.5
          done
          echo "server did not come up"; exit 1

      - name: End-to-end detection suite
        env:
          FCAPTCHA_SECRET: benchmark-test-secret-0123456789abcdef0123456789abcdef
        run: node test/test-detection.js

      # The widget in a real browser: the proof-of-work solver, and everything
      # about localization that is DOM-shaped rather than string-shaped (whether
      # <html lang> is consulted, whether dir="rtl" lands, whether the checkbox
      # resolves an accessible name).
      #
      # These existed but ran nowhere, so an assertion that a Playwright-driven
      # Chromium receives a token survived the shipping of the dispositive floor
      # that correctly stops exactly that. Untested tests rot quietly.
      # Builds client/dist so the minified-vs-source comparison has something to
      # compare against; it skips itself when dist/ is absent, and a test that
      # silently skips in CI is a test that is not running.
      - name: Build the distributable widget
        working-directory: client
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Install browser test dependencies
        working-directory: test/browser
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: test/browser
        run: npx playwright install --with-deps chromium

      # Includes the WCAG 2.2 AA checks. The repository claims that conformance
      # publicly, so it is verified on every change rather than audited once and
      # assumed: the palette failed on seven counts before these existed.
      - name: Browser suite
        working-directory: test/browser
        env:
          FCAPTCHA_REUSE_SERVER: '1'
        run: npm test

      # The harness itself, before it is trusted to measure anything. Sample
      # addresses have to stay unique or every per-source measurement is taken
      # against manufactured IP sharing.
      - name: Harness unit tests
        working-directory: bench
        run: npm test

      # Keeps paired browser-internal/control analysis reproducible and catches
      # broken pair metadata without turning research candidates into a gate.
      - name: Paired observation analysis
        working-directory: bench
        run: node tools/analyze-paired-observations.js --json paired-observations.json

      # Replays the committed corpus. No browser needed: capture is a separate,
      # manual step whose output lives in bench/corpus/.
      - name: Benchmark gate
        working-directory: bench
        run: node run-bench.js --gate --json bench-results.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bench-results
          path: |
            bench/bench-results.json
            bench/paired-observations.json
          if-no-files-found: ignore

  detector-parity:
    runs-on: ubuntu-latest
    env:
      FCAPTCHA_SECRET: benchmark-test-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Build all production servers
        run: |
          docker build -f server-node/Dockerfile -t fcaptcha-parity-node .
          docker build -f docker/Dockerfile -t fcaptcha-parity-go .
          docker build -f server-python/Dockerfile -t fcaptcha-parity-python .

      - name: Start all production servers
        run: |
          docker run -d --name parity-node -p 3001:3000 \
            -e FCAPTCHA_SECRET="$FCAPTCHA_SECRET" -e TRUSTED_PROXIES="*" fcaptcha-parity-node
          docker run -d --name parity-go -p 3002:3000 \
            -e FCAPTCHA_SECRET="$FCAPTCHA_SECRET" -e TRUSTED_PROXIES="*" fcaptcha-parity-go
          docker run -d --name parity-python -p 3003:3000 \
            -e FCAPTCHA_SECRET="$FCAPTCHA_SECRET" -e TRUSTED_PROXIES="*" fcaptcha-parity-python
          for port in 3001 3002 3003; do
            ready=false
            for _ in $(seq 1 60); do
              if curl -sf "http://localhost:${port}/health" >/dev/null; then ready=true; break; fi
              sleep 0.5
            done
            if [ "$ready" != true ]; then echo "server on ${port} did not become healthy"; exit 1; fi
          done

      - name: Compare base-corpus detector verdicts
        working-directory: bench
        run: |
          node tools/compare-server-parity.js \
            --server node=http://localhost:3001 \
            --server go=http://localhost:3002 \
            --server python=http://localhost:3003 \
            --json > server-parity.json

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: server-parity
          path: bench/server-parity.json
          if-no-files-found: ignore

      - name: Server logs
        if: failure()
        run: |
          docker logs parity-node || true
          docker logs parity-go || true
          docker logs parity-python || true

      - name: Cleanup
        if: always()
        run: docker rm -f parity-node parity-go parity-python >/dev/null 2>&1 || true
