name: Cross-server conformance

on:
  push:
    branches: [main]
    paths: ['server-go/**', 'server-node/**', 'server-python/**', 'test/conformance.js', 'bench/lib/pow.js', '.github/workflows/conformance.yml']
  pull_request:
    paths: ['server-go/**', 'server-node/**', 'server-python/**', 'test/conformance.js', 'bench/lib/pow.js', '.github/workflows/conformance.yml']

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: go
            dockerfile: docker/Dockerfile
          - name: node
            dockerfile: server-node/Dockerfile
          - name: python
            dockerfile: server-python/Dockerfile
    name: ${{ matrix.name }}
    env:
      FCAPTCHA_SECRET: conformance-test-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v7

      - name: Build production image
        run: docker build -f ${{ matrix.dockerfile }} -t fcaptcha-conformance .

      - name: Run shared contract for monitoring, pinned blocking, and unsupported selectors
        run: |
          for policy in '' stealth-corroboration-v1 stealth-corroboration-v0 true; do
            echo "Testing experimental policy selector: '${policy}'"
            docker run -d --name fcaptcha-conformance -p 3000:3000 \
              -e FCAPTCHA_SECRET="$FCAPTCHA_SECRET" \
              -e FCAPTCHA_EXPERIMENTAL_BLOCKING="$policy" fcaptcha-conformance
            ready=false
            for _ in $(seq 1 60); do
              if curl -sf http://localhost:3000/health >/dev/null; then
                ready=true
                break
              fi
              sleep 0.5
            done
            if [ "$ready" != true ]; then
              docker logs fcaptcha-conformance
              exit 1
            fi
            if [ "$policy" = stealth-corroboration-v1 ]; then
              node test/conformance.js http://localhost:3000 --experimental-blocking
            else
              node test/conformance.js http://localhost:3000
            fi
            docker rm -f fcaptcha-conformance
          done

      - name: Server logs
        if: failure()
        run: docker logs fcaptcha-conformance

      - name: Cleanup
        if: always()
        run: docker rm -f fcaptcha-conformance >/dev/null 2>&1 || true
