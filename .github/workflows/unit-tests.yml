name: Unit tests

# Go and Python unit tests, which nothing ran until now.
#
# Node's have been covered by the benchmark workflow since it existed, so the
# gap was invisible from the outside: every check on a pull request was green
# while two of the three implementations were unverified. Among the tests that
# had never run in CI:
#
#   - TestOnlyJA4TLSIsImplemented, which is the only thing standing between this
#     MIT project and a FoxIO License 1.1 module that cannot legally ship in it
#   - TestWeightsSumToOne, which guards the scoring weights invariant
#   - every Python test, on an implementation with no coverage but a container
#     smoke test
#
# The sync rule says a change lands in all three servers. That is worth very
# little if only one of them is checked.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Node (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci && npm audit --omit=dev && npm test
        working-directory: server-node

  browser:
    name: Browser lifecycle and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - run: npm ci && npm audit --omit=dev
        working-directory: server-node
      - run: npm ci && npm audit && npm run build
        working-directory: client
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: test/browser
      - run: npm test
        working-directory: test/browser

  react:
    name: React wrapper (React ${{ matrix.react }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ['18', '19']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Install package dependencies
        working-directory: packages/react
        run: npm ci
      - name: Select React version
        working-directory: packages/react
        run: npm install --no-save --no-package-lock react@${{ matrix.react }} react-dom@${{ matrix.react }}
      - name: Test package
        working-directory: packages/react
        run: npm test
      - name: Verify package contents
        working-directory: packages/react
        run: npm pack --dry-run

  go:
    name: Go (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.11', '1.27.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # crypto/tls only exposes ClientHelloInfo.Extensions from 1.24, which
          # native JA4 needs. go.mod says so; keep this in step with it.
          go-version: ${{ matrix.go }}
          cache-dependency-path: server-go/go.sum

      - name: Vet
        working-directory: server-go
        run: go vet ./...

      - name: Test
        working-directory: server-go
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: github.event_name != 'pull_request' && matrix.go == '1.27.4'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: server-go/coverage.out
          flags: server-go

      - name: Check reachable vulnerabilities
        working-directory: server-go
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

  go-client:
    # The importable package at the repository root (github.com/WebDecoy/FCaptcha),
    # tested on the oldest Go its go.mod admits and on the newest, and then
    # against a real server-go so the fake server in its unit tests cannot
    # drift from the contract it stands in for.
    name: Go client (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.23', '1.27.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: server-go/go.sum

      - name: Vet
        run: go vet .

      - name: Start server-go
        if: matrix.go == '1.27.4'
        run: |
          secret=$(openssl rand -hex 32)
          echo "FCAPTCHA_TEST_SECRET=$secret" >> "$GITHUB_ENV"
          echo "FCAPTCHA_TEST_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          (cd server-go && go build -o "$RUNNER_TEMP/fcaptcha-server" .)
          FCAPTCHA_SECRET=$secret PORT=3000 "$RUNNER_TEMP/fcaptcha-server" &
          for _ in $(seq 30); do
            curl -sf http://127.0.0.1:3000/health >/dev/null && exit 0
            sleep 1
          done
          echo "server-go did not become healthy" >&2
          exit 1

      # With the server up, the integration tests run instead of skipping.
      - name: Test
        run: go test -race -coverprofile=coverage.out .

      - name: Upload coverage
        if: github.event_name != 'pull_request' && matrix.go == '1.27.4'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: go-client

  python:
    name: Python (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: server-python/requirements.lock

      - name: Install dependencies
        working-directory: server-python
        # Resolve both files together so a requirements-only update cannot
        # silently leave CI exercising an incompatible older lockfile.
        run: pip install --require-hashes -r requirements.lock -r requirements.txt

      # Discovery, not a loop over files: a file that stops being discoverable
      # should show up as a drop in the count rather than as silence. It used to
      # report 12 tests and two import errors where there are in fact 43.
      - name: Test
        working-directory: server-python
        env:
          FCAPTCHA_SECRET: python-unit-test-secret-0123456789abcdef0123456789abcdef
        run: python -m unittest discover -p "test_*.py" -v
